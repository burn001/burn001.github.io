const $ = (id) => document.getElementById(id);
const TABS = ['exp', 'edu', 'pubs', 'proj', 'service', 'awards', 'repos'];
let current = 'exp';
function showTab(k, focus) {
  current = k;
  for (const t of TABS) {
    const on = t === k, b = $('tab-' + t);
    b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $('panel-' + t).hidden = !on;
    if (on && focus) b.focus();
  }
}
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) showTab(b.id.slice(4)); });
$('tabs').addEventListener('keydown', (e) => {
  const i = TABS.indexOf(current), n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (n) { e.preventDefault(); showTab(TABS[(i + n + TABS.length) % TABS.length], true); }
});
const rows = (list) => list.map(([w, x]) => `<li><span class="when">${w}</span><span class="what">${x}</span></li>`).join('');
function setLang(l) {
  const d = T[l];
  document.documentElement.lang = l;
  document.title = d.title;
  document.querySelectorAll('[data-t]').forEach((el) => { const v = d[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  $('fields').innerHTML = d.fields.map((f) => `<li>${f}</li>`).join('');
  const body = {
    pubs: `<ul class="plain">${d.pubs.map((p) => `<li>${p}</li>`).join('')}</ul>`,
    repos: `<ul class="repos">${d.repos.map(([n, x]) => `<li><a href="https://github.com/burn001/${n}">${n}</a><span>${x}</span></li>`).join('')}</ul>`,
  };
  for (const k of ['exp', 'edu', 'proj', 'service', 'awards']) body[k] = `<ul class="rows">${rows(d[k])}</ul>`;
  $('tabs').innerHTML = TABS.map((k) => `<button type="button" role="tab" id="tab-${k}" aria-controls="panel-${k}">${d.tabs[k]}</button>`).join('');
  $('panels').innerHTML = TABS.map((k) => `<div class="panel" role="tabpanel" id="panel-${k}" aria-labelledby="tab-${k}" tabindex="0" hidden>${body[k]}</div>`).join('');
  showTab(current);
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  try { localStorage.setItem('lang', l); } catch {}
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
let start = new URLSearchParams(location.search).get('lang') || location.hash.replace('#', '');
if (start !== 'ko' && start !== 'en') { try { start = localStorage.getItem('lang'); } catch {} }
setLang(start === 'ko' ? 'ko' : 'en');
if (window.THREE && window.mountAvatar) mountAvatar($('stage'));
